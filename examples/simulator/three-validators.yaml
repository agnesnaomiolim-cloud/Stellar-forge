# Demo bundle for `stellar-operator simulator up`.
# Generate fresh keypairs and export SIM_VALIDATOR_A_SEED, SIM_VALIDATOR_B_SEED,
# and SIM_VALIDATOR_C_SEED. Render before passing this file to the simulator:
# envsubst '${SIM_VALIDATOR_A_SEED} ${SIM_VALIDATOR_B_SEED} ${SIM_VALIDATOR_C_SEED}' < three-validators.yaml
---
apiVersion: v1
kind: Secret
metadata:
  name: sim-validator-a-seed
  namespace: stellar-system
type: Opaque
stringData:
  STELLAR_CORE_SEED: "${SIM_VALIDATOR_A_SEED}"
---
apiVersion: v1
kind: Secret
metadata:
  name: sim-validator-b-seed
  namespace: stellar-system
type: Opaque
stringData:
  STELLAR_CORE_SEED: "${SIM_VALIDATOR_B_SEED}"
---
apiVersion: v1
kind: Secret
metadata:
  name: sim-validator-c-seed
  namespace: stellar-system
type: Opaque
stringData:
  STELLAR_CORE_SEED: "${SIM_VALIDATOR_C_SEED}"
---
apiVersion: stellar.org/v1alpha1
kind: StellarNode
metadata:
  name: sim-validator-a
  namespace: stellar-system
spec:
  resourceMeta:
    labels:
      stellar.org/simulator-role: validator-a
  nodeType: Validator
  network: testnet
  version: "v21.0.0"
  replicas: 1
  storage:
    storageClass: "standard"
    size: "20Gi"
    retentionPolicy: Delete
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
  validatorConfig:
    seedSecretRef: sim-validator-a-seed
    enableHistoryArchive: false
---
apiVersion: stellar.org/v1alpha1
kind: StellarNode
metadata:
  name: sim-validator-b
  namespace: stellar-system
spec:
  resourceMeta:
    labels:
      stellar.org/simulator-role: validator-b
  nodeType: Validator
  network: testnet
  version: "v21.0.0"
  replicas: 1
  storage:
    storageClass: "standard"
    size: "20Gi"
    retentionPolicy: Delete
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
  validatorConfig:
    seedSecretRef: sim-validator-b-seed
    enableHistoryArchive: false
---
apiVersion: stellar.org/v1alpha1
kind: StellarNode
metadata:
  name: sim-validator-c
  namespace: stellar-system
spec:
  resourceMeta:
    labels:
      stellar.org/simulator-role: validator-c
  nodeType: Validator
  network: testnet
  version: "v21.0.0"
  replicas: 1
  storage:
    storageClass: "standard"
    size: "20Gi"
    retentionPolicy: Delete
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
  validatorConfig:
    seedSecretRef: sim-validator-c-seed
    enableHistoryArchive: false
