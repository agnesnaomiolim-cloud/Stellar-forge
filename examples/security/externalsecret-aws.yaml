# Replace the role ARN/region with the KMS/Secrets Manager reader created in
# docs/security/rbac-hardening.md. Requires ESO serving v1beta1 (operator contract).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stellar-seed-reader
  namespace: stellar
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/stellar-seed-read
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: stellar
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: stellar-seed-reader
            audiences: [sts.amazonaws.com]
