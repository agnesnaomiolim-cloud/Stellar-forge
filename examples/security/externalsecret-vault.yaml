# Requires configured Vault Kubernetes auth and ESO serving v1beta1.
# Create ConfigMap/vault-ca with the PEM CA certificate under key ca.crt first.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stellar-seed-reader
  namespace: stellar
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-secrets
  namespace: stellar
spec:
  provider:
    vault:
      server: https://vault.vault.svc:8200
      caProvider:
        type: ConfigMap
        name: vault-ca
        key: ca.crt
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: stellar-validator
          serviceAccountRef:
            name: stellar-seed-reader
            audiences: [vault]
