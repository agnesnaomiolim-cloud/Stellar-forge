[package]
name = "controller"
version = "0.1.0"
edition = "2021"
description = "Stellar-K8s deployment, catchup, snapshot, admission and testnet APIs"
license = "Apache-2.0"
autobins = false

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots", "rustls-tls"] }
async-trait = "0.1"
axum = { version = "0.8", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
base64 = "0.21"
anyhow = "1"
thiserror = "1"
sha2 = "0.10"
hex = "0.4"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
kube = { version = "0.94", features = ["runtime", "derive"], optional = true }
k8s-openapi = { version = "0.22", features = ["v1_30"], optional = true }
ed25519-dalek = { version = "2", features = ["rand_core"], optional = true }
schemars = { version = "0.8", optional = true }
serde_yaml = { version = "0.9", optional = true }
wasmtime = { version = "36.0.18", optional = true }
wasmtime-wasi = { version = "36.0.18", features = ["preview1"], optional = true }

[features]
default = []
admission-webhook = ["dep:wasmtime", "dep:wasmtime-wasi"]
kube-backend = ["dep:kube", "dep:k8s-openapi"]
testnet = ["dep:kube", "dep:k8s-openapi", "dep:ed25519-dalek", "dep:schemars", "dep:serde_yaml"]

[[bin]]
name = "pdb-controller"
path = "src/bin/pdb-controller.rs"
required-features = ["kube-backend"]

[[bin]]
name = "stellar-testnet-operator"
path = "src/bin/stellar-testnet-operator.rs"
required-features = ["testnet"]

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
wiremock = "=0.6.5"
wat = "1.246"
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "registry_policy_test"
path = "tests/registry_policy_test.rs"
required-features = ["admission-webhook"]
