[package]
name = "controller"
version = "0.1.0"
edition = "2021"
description = "Stellar-K8s controller: deployment pipeline and admission webhook modules"
license = "Apache-2.0"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client for sidecar communication
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-manual-roots",
] }

# HTTP server (sidecar + axum handler)
axum = { version = "0.8", features = [] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Base64 encoding/decoding (WASM binary field in StellarNode spec)
base64 = "0.21"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"

# Async trait support (used by ingestion::worker::LedgerProcessor)
async-trait = "0.1"

# Temporary files for wasm-opt subprocess I/O
tempfile = "3"

# Async trait objects for the pluggable cloud snapshot provider (issue #84)
async-trait = "0.1"
# Timestamps for snapshot age-based retention policy and descriptor serde
chrono = { version = "0.4", features = ["clock", "serde"] }
# SHA-256 for snapshot integrity verification (restore validation)
sha2 = "0.10"
# Hex encoding for checksum output
hex = "0.4"
# HMAC-SHA256 for AWS SigV4 request signing (EBS snapshot API calls)
hmac = "0.12"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
axum = { version = "0.8", features = [] }
serde_json = "1"
base64 = "0.21"
# Mock HTTP server for exercising the AWS EBS / GCP PD request round-trips
# without a live cloud. Pinned to match the version used elsewhere in the repo.
wiremock = "=0.6.5"

[workspace]
