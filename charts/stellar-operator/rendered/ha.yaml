apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/instance: stellar-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/version: 2.21.0
    helm.sh/chart: stellar-operator-2.21.0
  name: stellar-operator
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: stellar-operator
      app.kubernetes.io/name: stellar-operator
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: '9090'
        prometheus.io/scrape: 'true'
      labels:
        app.kubernetes.io/instance: stellar-operator
        app.kubernetes.io/name: stellar-operator
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - stellar-operator
                - key: app.kubernetes.io/instance
                  operator: In
                  values:
                  - stellar-operator
              topologyKey: kubernetes.io/hostname
            weight: 100
      containers:
      - args:
        - run
        - --log-level=info
        - --namespace=stellar-system
        env:
        - name: STELLAR_OPERATOR_CONFIG
          value: /etc/stellar-operator/config.yaml
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OPERATOR_NAMESPACE
          value: stellar-system
        - name: REST_API_PORT
          value: '9090'
        image: ghcr.io/stellar/stellar-k8s:2.21.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /livez
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
        name: stellar-operator
        ports:
        - containerPort: 9090
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 1000m
            memory: 512Mi
          requests:
            cpu: 500m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 24
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - mountPath: /etc/stellar-operator
          name: operator-config
          readOnly: true
      - command:
        - /stellar-sidecar
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: CONTAINER_NAME
          value: stellar-operator
        - name: RUST_LOG
          value: info
        image: ghcr.io/stellar/stellar-k8s:2.21.0
        imagePullPolicy: IfNotPresent
        name: crash-analyzer
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      serviceAccountName: stellar-operator
      volumes:
      - configMap:
          name: stellar-operator-defaults
        name: operator-config
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  annotations:
    stellar.org/policy-topology: >-
      default-deny for the operator namespace. Allows only kube-apiserver
      reachability, cluster DNS, and the operator's metrics/REST API ports.
  labels:
    app.kubernetes.io/instance: stellar-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/version: 2.21.0
    helm.sh/chart: stellar-operator-2.21.0
  name: stellar-operator-default-deny
  namespace: stellar-system
spec:
  egress:
  - ports:
    - port: 443
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          component: kube-apiserver
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          k8s-app: kube-dns
  ingress:
  - from:
    - podSelector: {}
    ports:
    - port: 9090
      protocol: TCP
    - port: 9090
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - port: 9090
      protocol: TCP
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: v1
kind: Pod
metadata:
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/component: test
    app.kubernetes.io/instance: stellar-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/version: 2.21.0
    helm.sh/chart: stellar-operator-2.21.0
  name: stellar-operator-test
  namespace: stellar-system
spec:
  containers:
  - command:
    - /bin/sh
    - -c
    - |
      set -e
      echo "=== Stellar Operator Helm Test ==="

      # Test 1: Operator deployment is ready
      echo "Test 1: Checking operator deployment..."
      kubectl wait --for=condition=available --timeout=60s \
        deployment/stellar-operator \
        -n stellar-system
      echo "✓ Operator deployment is ready"

      # Test 2: CRDs are installed
      echo "Test 2: Checking CRD installation..."
      kubectl get crd stellarnodes.stellar.org
      echo "✓ StellarNode CRD is installed"

      # Test 3: Service is accessible
      echo "Test 3: Checking service accessibility..."
      kubectl get service stellar-operator -n stellar-system
      echo "✓ Operator service exists"

      # Test 4: Metrics endpoint is responding
      echo "Test 4: Checking metrics endpoint..."
      POD_NAME=$(kubectl get pods -n stellar-system \
        -l app.kubernetes.io/name=stellar-operator -o jsonpath='{.items[0].metadata.name}')
      kubectl exec -n stellar-system $POD_NAME -- wget -q -O- http://localhost:9090/metrics | grep -q "stellar_"
      echo "✓ Metrics endpoint is responding"

      # Test 5: RBAC permissions
      echo "Test 5: Checking RBAC permissions..."
      kubectl auth can-i get stellarnodes --as=system:serviceaccount:stellar-system:stellar-operator
      kubectl auth can-i create pods --as=system:serviceaccount:stellar-system:stellar-operator
      echo "✓ RBAC permissions are configured"

      # Test 6: Webhook configuration (if enabled)
      echo "Test 6: Checking admission webhook..."
      kubectl get validatingwebhookconfigurations | grep stellar
      echo "✓ Admission webhook is configured"

      echo ""
      echo "=== All Tests Passed ==="
      echo "✓ Stellar Operator is healthy and ready"
    image: ghcr.io/stellar/stellar-k8s:2.21.0
    imagePullPolicy: IfNotPresent
    name: test
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
      readOnlyRootFilesystem: true
  restartPolicy: Never
  securityContext:
    fsGroup: 65532
    runAsGroup: 65532
    runAsNonRoot: true
    runAsUser: 65532
  serviceAccountName: stellar-operator
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app.kubernetes.io/instance: stellar-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/version: 2.21.0
    helm.sh/chart: stellar-operator-2.21.0
  name: stellar-operator
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: stellar-operator
      app.kubernetes.io/name: stellar-operator
