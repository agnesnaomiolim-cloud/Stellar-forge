apiVersion: v1
data:
  config.yaml: |
    defaultResources:
      validator:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
      horizon:
        requests:
          cpu: "250m"
          memory: "512Mi"
        limits:
          cpu: "2"
          memory: "4Gi"
      sorobanRpc:
        requests:
          cpu: "500m"
          memory: "2Gi"
        limits:
          cpu: "4"
          memory: "8Gi"
    keyRotation:
      enabled: false
      intervalSecs: 86400
      validationWindowSecs: 30
      validationSampleIntervalSecs: 5
      minAuthenticatedPeers: 1
      maxUnhealthySamples: 0
      rollbackOnFailure: true
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: stellar-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/version: 2.21.0
    helm.sh/chart: stellar-operator-2.21.0
  name: stellar-operator-defaults
---
apiVersion: v1
data:
