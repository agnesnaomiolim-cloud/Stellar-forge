apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  labels:
    app.kubernetes.io/instance: stellar-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/version: 2.21.0
    helm.sh/chart: stellar-operator-2.21.0
  name: stellarnodes.stellar.org
spec:
  group: stellar.org
  names:
    kind: StellarNode
    listKind: StellarNodeList
    plural: stellarnodes
    shortNames:
    - sn
    singular: stellarnode
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeType
      name: Type
      type: string
    - jsonPath: .spec.network
      name: Network
      type: string
    - jsonPath: .spec.replicas
      name: Replicas
      type: integer
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          spec:
            properties:
              autoscaling:
                properties:
                  cache:
                    description: Bounded fail-open cache for read-only Soroban
                      RPC state requests
                    properties:
                      enabled:
                        default: false
                        type: boolean
                      image:
                        nullable: true
                        type: string
                      maxBytes:
                        default: 67108864
                        format: int64
                        maximum: 67108864
                        minimum: 1
                        type: integer
                      maxEntries:
                        default: 10000
                        format: int64
                        maximum: 10000
                        minimum: 1
                        type: integer
                      ttlSecs:
                        default: 30
                        format: int64
                        minimum: 1
                        type: integer
                    type: object
                type: object
                x-kubernetes-preserve-unknown-fields: true
              backupConfig:
                description: >-
                  Pre-upgrade backup configuration for Validator PVC snapshots.
                  When set, the operator snapshots the PVC before applying
                  a new version.
                properties:
                  encryptionKeyRef:
                    description: Reference to a Cloud KMS key for encrypting
                      the snapshot.
                    nullable: true
                    type: string
                  flushBeforeSnapshot:
                    default: false
                    description: >-
                      If true, attempt to flush/lock the Stellar DB briefly
                      before creating the snapshot.
                    type: boolean
                  readyTimeoutSeconds:
                    default: 300
                    description: >-
                      Maximum time in seconds to wait for the snapshot to
                      become ReadyToUse before failing the upgrade.
                    format: int64
                    minimum: 0
                    type: integer
                  volumeSnapshotClassName:
                    description: >-
                      VolumeSnapshotClass name. If unset, the default class
                      for the PVC's driver is used.
                    type: string
                type: object
              diagnosticSidecarResources:
                description: >-
                  Resource requests and limits for the operator-managed
                  diagnostic health-check sidecar. Defaults to 50m CPU and
                  64Mi memory for both requests and limits when unset.
                nullable: true
                properties:
                  limits:
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                    type: object
                  requests:
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                    type: object
                type: object
              forensicSnapshot:
                description: >-
                  Forensic capture (PCAP, core) uploaded to S3; trigger
                  via annotation stellar.org/request-forensic-snapshot.
                properties:
                  credentialsSecretRef:
                    nullable: true
                    type: string
                  enableShareProcessNamespace:
                    type: boolean
                  kmsKeyId:
                    nullable: true
                    type: string
                  s3Bucket:
                    type: string
                  s3Prefix:
                    nullable: true
                    type: string
                type: object
              horizonConfig:
                properties:
                  databaseSecretRef:
                    type: string
                  enableExperimentalIngestion:
                    type: boolean
                  enableIngest:
                    type: boolean
                  ingestWorkers:
                    type: integer
                  stellarCoreUrl:
                    type: string
                type: object
              network:
                description: Target Stellar network
                type: string
              nodeType:
                description: Type of Stellar node to deploy
                enum:
                - Validator
                - Horizon
                - SorobanRpc
                type: string
              podAntiAffinity:
                default: Hard
                description: Pod anti-affinity strength for same-network
                  stellar-node pods
                enum:
                - Hard
                - Soft
                - Disabled
                type: string
              replicas:
                default: 1
                description: Number of replicas (RPC nodes only)
                minimum: 0
                type: integer
              resources:
                properties:
                  limits:
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                    type: object
                  requests:
                    properties:
                      cpu:
                        type: string
                      memory:
                        type: string
                    type: object
                type: object
              restoreFromSnapshot:
                description: >-
                  Bootstrap this node from an existing VolumeSnapshot (Validator
                  only). PVC is created from the snapshot.
                properties:
                  namespace:
                    description: >-
                      Optional namespace of the VolumeSnapshot (CrossNamespaceVolumeDataSource).
                    type: string
                  volumeSnapshotName:
                    description: >-
                      Name of the VolumeSnapshot to restore from (same namespace
                      as StellarNode).
                    type: string
                type: object
              serviceConfig:
                properties:
                  httpNodePort:
                    description: NodePort for HTTP API access
                    maximum: 32767
                    minimum: 30000
                    type: integer
                  peerNodePort:
                    description: NodePort for peer connections (validators
                      only)
                    maximum: 32767
                    minimum: 30000
                    type: integer
                type: object
              snapshotSchedule:
                description: >-
                  Schedule and options for CSI VolumeSnapshots of the node
                  data PVC (Validator only).
                properties:
                  flushBeforeSnapshot:
                    default: false
                    description: >-
                      If true, attempt to flush/lock the Stellar DB briefly
                      before creating the snapshot.
                    type: boolean
                  retentionCount:
                    default: 0
                    description: Max snapshots to retain per node. 0 means
                      no limit.
                    format: int32
                    type: integer
                  schedule:
                    description: >-
                      Cron expression for scheduled snapshots (e.g. "0 2
                      * * *" for daily at 2 AM). If unset, snapshots only
                      on annotation stellar.org/request-snapshot=true.
                    type: string
                  volumeSnapshotClassName:
                    description: >-
                      VolumeSnapshotClass name. If unset, default class
                      for the driver is used.
                    type: string
                type: object
              sorobanConfig:
                properties:
                  captiveCoreConfig:
                    type: string
                  captiveCoreStructuredConfig:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                  enablePreflight:
                    type: boolean
                  maxEventsPerRequest:
                    type: integer
                  stellarCoreUrl:
                    type: string
                type: object
                x-kubernetes-preserve-unknown-fields: true
              storage:
                properties:
                  annotations:
                    additionalProperties:
                      type: string
                    description: >-
                      Optional annotations to apply to the PersistentVolumeClaim
                      (useful for storage-class specific parameters like
                      volumeBindingMode)
                    nullable: true
                    type: object
                  retentionPolicy:
                    default: Delete
                    enum:
                    - Delete
                    - Retain
                    type: string
                  size:
                    type: string
                  storageClass:
                    type: string
                type: object
              strategy:
                properties:
                  blueGreen:
                    description: Validator (Stellar Core) blue/green rollout
                      settings
                    properties:
                      maxLedgerLag:
                        default: 5
                        type: integer
                      postCutoverSuccessThreshold:
                        default: 3
                        type: integer
                      readyTimeoutSeconds:
                        default: 3600
                        type: integer
                      requireVolumeSnapshot:
                        default: true
                        type: boolean
                      rollbackWindowSeconds:
                        default: 3600
                        type: integer
                      volumeSnapshotClassName:
                        type: string
                    type: object
                  canary:
                    properties:
                      checkIntervalSeconds:
                        default: 300
                        type: integer
                      weight:
                        default: 10
                        maximum: 100
                        minimum: 0
                        type: integer
                    type: object
                  rollingUpdate:
                    type: object
                  type:
                    enum:
                    - rollingUpdate
                    - canary
                    - blueGreen
                    type: string
                type: object
              suspended:
                default: false
                description: Suspend the node without deleting resources
                type: boolean
              validatorConfig:
                properties:
                  catchupComplete:
                    type: boolean
                  enableHistoryArchive:
                    type: boolean
                  historyArchiveUrls:
                    items:
                      type: string
                    type: array
                  hsmConfig:
                    properties:
                      hsmCredentialsSecretRef:
                        nullable: true
                        type: string
                      hsmIp:
                        nullable: true
                        type: string
                      pkcs11LibPath:
                        description: >-
                          Path to the PKCS#11 library (e.g. /opt/cloudhsm/lib/libcloudhsm_pkcs11.so)
                        type: string
                      provider:
                        enum:
                        - AWS
                        - Azure
                        type: string
                    required:
                    - provider
                    - pkcs11LibPath
                    type: object
                  quorumSet:
                    type: string
                  seedSecretRef:
                    type: string
                  seedSecretSource:
                    description: >-
                      Typed seed source; exactly one of localRef, externalRef,
                      csiRef, vaultRef.
                    properties:
                      csiRef:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      externalRef:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      localRef:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      vaultRef:
                        properties:
                          extraPodAnnotations:
                            items:
                              properties:
                                name:
                                  type: string
                                value:
                                  type: string
                              type: object
                            type: array
                          restartOnSecretRotation:
                            type: boolean
                          role:
                            type: string
                          secretFileName:
                            nullable: true
                            type: string
                          secretKey:
                            nullable: true
                            type: string
                          secretPath:
                            type: string
                          template:
                            nullable: true
                            type: string
                        type: object
                    type: object
                type: object
              version:
                description: Container image version
                type: string
            required:
            - nodeType
            - network
            - version
            type: object
          status:
            properties:
              blueGreenActiveColor:
                description: Active deployment color (blue or green).
                nullable: true
                type: string
              blueGreenMessage:
                description: Human-readable blue/green progress message.
                nullable: true
                type: string
              blueGreenPhase:
                description: Validator blue/green rollout phase.
                nullable: true
                type: string
              blueGreenSnapshotName:
                description: VolumeSnapshot used to seed the green Validator
                  PVC.
                nullable: true
                type: string
              blueGreenTargetVersion:
                description: Target Core version for an in-progress blue/green
                  rollout.
                nullable: true
                type: string
              canaryReadyReplicas:
                type: integer
              canaryVersion:
                type: string
              conditions:
                items:
                  properties:
                    lastTransitionTime:
                      type: string
                    message:
                      type: string
                    reason:
                      type: string
                    status:
                      type: string
                    type:
                      type: string
                  type: object
                type: array
              endpoint:
                type: string
              forensicSnapshotPhase:
                description: Phase of forensic snapshot (Capturing, Complete,
                  Failed).
                type: string
              ledgerSequence:
                format: int64
                type: integer
              message:
                type: string
              observedGeneration:
                format: int64
                type: integer
              phase:
                type: string
              readyReplicas:
                type: integer
              replicas:
                type: integer
              vaultObservedSecretVersion:
                description: Last Vault secret version observed for rotation-driven
                  rollouts.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
