apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  annotations:
    stellar.org/hpa-signals: tps,queue-length
    stellar.org/metrics-server: custom.metrics.k8s.io/v1beta2
  labels:
    app.kubernetes.io/component: horizon-autoscaler
    app.kubernetes.io/instance: stellar-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/version: 2.21.0
    helm.sh/chart: stellar-operator-2.21.0
  name: stellar-operator-horizon-hpa
  namespace: stellar-mainnet
spec:
  behavior:
    scaleDown:
      policies:
      - periodSeconds: 120
        type: Pods
        value: 1
      selectPolicy: Min
      stabilizationWindowSeconds: 300
    scaleUp:
      policies:
      - periodSeconds: 60
        type: Pods
        value: 4
      - periodSeconds: 60
        type: Percent
        value: 100
      selectPolicy: Max
      stabilizationWindowSeconds: 60
  maxReplicas: 20
  metrics:
  - object:
      describedObject:
        apiVersion: stellar.org/v1alpha1
        kind: StellarNode
        name: horizon
      metric:
        name: stellar_horizon_tps
      target:
        type: Value
        value: '100'
    type: Object
  - object:
      describedObject:
        apiVersion: stellar.org/v1alpha1
        kind: StellarNode
        name: horizon
      metric:
        name: stellar_horizon_queue_length
      target:
        type: Value
        value: '500'
    type: Object
  minReplicas: 3
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: horizon
