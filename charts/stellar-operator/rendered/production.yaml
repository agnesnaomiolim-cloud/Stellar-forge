apiVersion: v1
data:
  config.yaml: |
    defaultResources:
      validator:
        requests:
          cpu: "2"
          memory: "8Gi"
        limits:
          cpu: "4"
          memory: "16Gi"
      horizon:
        requests:
          cpu: "1"
          memory: "4Gi"
        limits:
          cpu: "4"
          memory: "16Gi"
      sorobanRpc:
        requests:
          cpu: "2"
          memory: "8Gi"
        limits:
          cpu: "8"
          memory: "32Gi"
    keyRotation:
      enabled: false
      intervalSecs: 86400
      validationWindowSecs: 30
      validationSampleIntervalSecs: 5
      minAuthenticatedPeers: 1
      maxUnhealthySamples: 0
      rollbackOnFailure: true
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: stellar-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/version: 2.21.0
    helm.sh/chart: stellar-operator-2.21.0
  name: stellar-operator-defaults
---
apiVersion: v1
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

    processors:
      batch:
        timeout: 5s
        send_batch_size: 512
      memory_limiter:
        check_interval: 1s
        limit_mib: 200

    exporters:
      otlp/tempo:
        endpoint: "http://tempo.monitoring.svc.cluster.local:4317"
        tls:
          insecure: true
      loki:
        endpoint: "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
      # Always include a debug exporter so the collector starts even with no
      # backend configured (useful for local development).
      debug:
        verbosity: basic

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters:
            - debug
            - otlp/tempo
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters:
            - debug
            - loki
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: stellar-operator
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: stellar-operator
    app.kubernetes.io/version: 2.21.0
    helm.sh/chart: stellar-operator-2.21.0
  name: stellar-operator-otel-collector
