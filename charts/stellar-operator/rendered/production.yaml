  selector:
    matchLabels:
      app.kubernetes.io/instance: stellar-operator
      app.kubernetes.io/name: stellar-operator
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: '9090'
        prometheus.io/scrape: 'true'
      labels:
        app.kubernetes.io/instance: stellar-operator
        app.kubernetes.io/name: stellar-operator
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - stellar-operator
              topologyKey: topology.kubernetes.io/zone
            weight: 100
      containers:
      - args:
        - run
        - --log-level=info
        - --namespace=stellar-system
        env:
        - name: STELLAR_OPERATOR_CONFIG
          value: /etc/stellar-operator/config.yaml
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: HOSTNAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: OPERATOR_NAMESPACE
          value: stellar-system
        - name: REST_API_PORT
          value: '9090'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://tempo.monitoring.svc.cluster.local:4317
        image: ghcr.io/stellar/stellar-k8s:0.1.0
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /livez
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
        name: stellar-operator
        ports:
        - containerPort: 9090
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 2000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 24
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - mountPath: /etc/stellar-operator
          name: operator-config
          readOnly: true
      - command:
        - /stellar-sidecar
        env:
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: CONTAINER_NAME
          value: stellar-operator
        - name: RUST_LOG
          value: info
        image: ghcr.io/stellar/stellar-k8s:0.1.0
        imagePullPolicy: IfNotPresent
        name: crash-analyzer
        resources:
          limits:
            cpu: 100m
            memory: 64Mi
          requests:
            cpu: 50m
            memory: 32Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      nodeSelector:
        stellar.org/node-pool: operator
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
      serviceAccountName: stellar-operator
      tolerations:
      - effect: NoSchedule
        key: stellar.org/dedicated
        operator: Equal
        value: operator
      volumes:
      - configMap:
          name: stellar-operator-defaults
        name: operator-config
