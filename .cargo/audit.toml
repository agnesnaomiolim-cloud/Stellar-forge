[advisories]
# Only current informational warnings and unused sqlx-mysql remain.
# Re-evaluate informational warnings when upgrading kube-rs and sled.
# No Wasmtime, h2, TLS, or pqcrypto vulnerabilities are suppressed.
ignore = [
    "RUSTSEC-2025-0012", # backoff, transitive via kube-runtime
    "RUSTSEC-2024-0388", # derivative, transitive via kube-runtime
    "RUSTSEC-2024-0384", # instant, transitive via backoff
    "RUSTSEC-2025-0057", # fxhash, transitive via sled
    "RUSTSEC-2025-0134", # rustls-pemfile, transitive via kube-client
    # No RSA operations are enabled: only sqlx's Postgres driver is used.
    # Revisit https://github.com/RustCrypto/RSA/issues/626 when patched.
    "RUSTSEC-2023-0071",
]
