[package]
name = "gov-registry"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Checkpointed transitive governance delegation and voting registry"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "=27.0.6"

[dev-dependencies]
soroban-sdk = { version = "=27.0.6", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1
strip = "symbols"

[workspace]
