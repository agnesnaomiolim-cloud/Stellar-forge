[package]
name = "gas-oracle"
version = "0.1.0"
edition = "2021"
description = "Soroban oracle that tracks gas fee rates using an exponential moving average."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "22.0.0"

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
