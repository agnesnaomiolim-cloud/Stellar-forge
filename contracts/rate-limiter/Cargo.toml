[package]
name = "rate-limiter"
version = "0.1.0"
edition = "2021"
description = "Token-bucket rate limiter for Soroban contract entry points."

[workspace]

[dependencies]
soroban-sdk = "20.0.0"

[dev-dependencies]
soroban-sdk = { version = "20.0.0", features = ["testutils"] }

[lib]
crate-type = ["cdylib", "rlib"]
