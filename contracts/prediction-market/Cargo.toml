[package]
name = "prediction-market"
version = "0.1.0"
edition = "2021"
description = "Soroban contract implementing a binary prediction market with limit-order matching."

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "22"

[dev-dependencies]
soroban-sdk = { version = "22", features = ["testutils"] }
