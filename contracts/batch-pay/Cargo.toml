[package]
name = "batch-pay"
version = "0.1.0"
edition = "2021"
description = "Soroban contract for processing batched token payouts to multiple recipients."

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "20.0.0"

[dev-dependencies]
soroban-sdk = { version = "20.0.0", features = ["testutils"] }
